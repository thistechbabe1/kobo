name: CI

on:
  push:
    branches: [main, feature/**, fix/**, cleanup/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & Integration tests
        run: npm test

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js production app
        run: npm run build
        env:
          # Use GitHub Actions secret if provisioned, or labeled test-only CI secret (strictly distinct from production)
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'CI_TEST_ONLY_SECRET_KEY_NOT_FOR_PRODUCTION_USE_32B!' }}

      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          # Use GitHub Actions secret if provisioned, or labeled test-only CI secret (strictly distinct from production)
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'CI_TEST_ONLY_SECRET_KEY_NOT_FOR_PRODUCTION_USE_32B!' }}
          E2E_DETERMINISTIC: '1'

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
