name: Kobo CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run WCAG Contrast Audit
        run: npx tsx scripts/check-contrast.ts

      - name: Run Vitest Unit Tests
        env:
          SESSION_SECRET: "dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seTMyYnl0ZXM="
        run: npm run test

      - name: Build Next.js Production App
        env:
          SESSION_SECRET: "dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seTMyYnl0ZXM="
        run: npm run build
